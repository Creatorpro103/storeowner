<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Store Owner</title>
    <meta name="description" content="Run your own corner store. Stock the shelves, work the register and hire a crew. Not everyone comes to shop.">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
      #unity-container.unity-desktop { left: 0; top: 0; transform: none; width: 100%; height: 100%; }
      #unity-canvas { display: block; background: #0b0b0d; }
      #unity-logo-title-footer { display: none; }
      #unity-footer { margin: 0; height: 38px; padding: 0 10px; box-sizing: border-box; }
      #unity-build-title { color: #ddd; }
      #unity-load-text { position: absolute; left: 0; right: 0; top: calc(50% + 70px); text-align: center; color: #ddd; font: 15px sans-serif; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-load-text"></div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Store Owner</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: "",   // filled in by joinDataParts below
        frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Isaac",
        productName: "Store Owner",
        productVersion: "0.4",
        showBanner: unityShowBanner,
        // browsers can refuse mouse capture (window not focused, Esc just pressed). The game simply pauses, so don't show the scary popup.
        errorHandler: function(message) {
          if (/pointer ?lock|exited the lock/i.test(String(message))) { console.warn(message); return true; }
          return false;
        },
        cacheControl: function() { return "no-store"; },   // the parts are cached by the browser; don't store joined copies too
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "100%";
        canvas.style.height = "calc(100% - 38px)";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      // GitHub limits file sizes, so the game data ships in parts. Download them, then join them.
      var dataParts = [47185920, 47185920, 47185920, 47185920, 47185920, 5937226];
      function joinDataParts(onProgress) {
        var total = dataParts.reduce((a, b) => a + b, 0), got = new Array(dataParts.length).fill(0), done = 0;
        var report = () => onProgress(got.reduce((a, b) => a + b, 0) / total);
        async function fetchPart(i, attempt) {
          var name = buildUrl + "/WebBuild.data.unityweb.part" + String(i).padStart(2, "0");
          try {
            var res = await fetch(name);
            if (!res.ok) throw new Error(name + ": HTTP " + res.status);
            var reader = res.body.getReader(), chunks = [];
            got[i] = 0;
            for (;;) {
              var r = await reader.read();
              if (r.done) break;
              chunks.push(r.value);
              got[i] += r.value.length;
              report();
            }
            var blob = new Blob(chunks);
            if (blob.size != dataParts[i]) throw new Error(name + ": incomplete download");
            return blob;
          } catch (e) {
            if (attempt >= 3) throw e;
            await new Promise(ok => setTimeout(ok, 1000 * attempt));
            return fetchPart(i, attempt + 1);
          }
        }
        var blobs = new Array(dataParts.length), next = 0;
        async function worker() {
          while (next < dataParts.length) { var i = next++; blobs[i] = await fetchPart(i, 1); }
        }
        return Promise.all([worker(), worker(), worker()]).then(() => URL.createObjectURL(new Blob(blobs)));
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        var bar = document.querySelector("#unity-progress-bar-full"), text = document.querySelector("#unity-load-text");
        var totalMB = Math.round(dataParts.reduce((a, b) => a + b, 0) / 1000000);
        joinDataParts((p) => {
          bar.style.width = 80 * p + "%";
          text.textContent = "Downloading the store: " + Math.round(p * totalMB) + " of " + totalMB + " MB";
        }).then((url) => {
          config.dataUrl = url;
          text.textContent = "Unpacking... this can take a minute";
          return createUnityInstance(canvas, config, (progress) => {
            bar.style.width = 80 + 20 * progress + "%";
          });
        }).then((unityInstance) => {
                text.textContent = "";
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                text.textContent = "";
                unityShowBanner("The game could not load: " + message, "error");
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
